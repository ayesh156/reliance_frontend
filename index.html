<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reliance - Retail &amp; Wholesale Store</title>
    <meta name="description" content="Reliance — Retail and wholesale store. Shop products online or visit our store for wholesale pricing." />
    
    <!-- PWA Web App Manifest & Mobile Capability Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reliance POS" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8f8f6] dark:bg-[#09090b] text-[#09090b] dark:text-zinc-100 antialiased">
    <!-- Luxury Branded Startup Splash Screen for Standalone PWA / Web App -->
    <div id="pwa-splash-screen">
      <style>
        #pwa-splash-screen {
          position: fixed;
          inset: 0;
          z-index: 999999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
          color: #ffffff;
          user-select: none;
          transition: opacity 500ms cubic-bezier(0.4, 0, 0.2, 1);
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .splash-emblem-container {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 110px;
          height: 110px;
          margin-bottom: 24px;
        }
        .splash-pulse-ring {
          position: absolute;
          inset: -10px;
          border-radius: 9999px;
          background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, rgba(16, 185, 129, 0) 70%);
          animation: splashPulse 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .splash-pulse-ring-2 {
          position: absolute;
          inset: -22px;
          border-radius: 9999px;
          background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(99, 102, 241, 0) 70%);
          animation: splashPulse 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
          animation-delay: 0.8s;
        }
        .splash-logo-box {
          position: relative;
          width: 88px;
          height: 88px;
          border-radius: 22px;
          background: linear-gradient(135deg, #27272a 0%, #09090b 100%);
          border: 1px solid rgba(255, 255, 255, 0.15);
          box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 30px rgba(16, 185, 129, 0.25);
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
        }
        .splash-logo-img {
          width: 64px;
          height: 64px;
          object-fit: contain;
          border-radius: 14px;
        }
        .splash-title {
          font-size: 24px;
          font-weight: 800;
          letter-spacing: 0.28em;
          text-transform: uppercase;
          background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 6px;
          margin-left: 0.28em;
        }
        .splash-subtitle {
          font-size: 10px;
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #71717a;
          margin-bottom: 32px;
          text-align: center;
          padding: 0 16px;
        }
        .splash-progress-track {
          width: 170px;
          height: 3px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
        }
        .splash-progress-bar {
          position: absolute;
          top: 0;
          left: 0;
          bottom: 0;
          width: 45%;
          background: linear-gradient(90deg, #10b981 0%, #6366f1 100%);
          border-radius: 9999px;
          animation: splashIndeterminate 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        .splash-status-text {
          margin-top: 14px;
          font-size: 11px;
          font-weight: 500;
          letter-spacing: 0.04em;
          color: #a1a1aa;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .splash-spinner {
          width: 12px;
          height: 12px;
          border: 2px solid rgba(16, 185, 129, 0.2);
          border-top-color: #10b981;
          border-radius: 50%;
          animation: splashSpin 0.8s linear infinite;
        }
        @keyframes splashPulse {
          0%, 100% { transform: scale(0.92); opacity: 0.35; }
          50% { transform: scale(1.15); opacity: 0.85; }
        }
        @keyframes splashIndeterminate {
          0% { left: -45%; width: 35%; }
          50% { left: 30%; width: 55%; }
          100% { left: 105%; width: 35%; }
        }
        @keyframes splashSpin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="splash-emblem-container">
        <div class="splash-pulse-ring-2"></div>
        <div class="splash-pulse-ring"></div>
        <div class="splash-logo-box">
          <img src="/icons/icon-192x192.png" alt="Reliance" class="splash-logo-img" onerror="this.src='/images/logo.jpg'" />
        </div>
      </div>
      <div class="splash-title">RELIANCE</div>
      <div class="splash-subtitle">Branded Mens Clothing &amp; Manufacturing</div>
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
      <div class="splash-status-text">
        <div class="splash-spinner"></div>
        <span>Initializing Enterprise Suite...</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
